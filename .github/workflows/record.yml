name: Record JKT48 lives

# Each run polls every 30 s for ~5h40m, then the next hourly run takes over
# (only one run at a time; a queued run starts as soon as the current one ends).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: recorder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # src/poll.js pushes data with the checkout token, so it must persist.
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # global WebSocket for the IDN chat listener

      - name: Test polling HTTP backoff
        run: npm test

      - name: Poll IDN Live and SHOWROOM
        env:
          POLL_SECONDS: "30"
          RUN_MINUTES: "340"
          COMMIT_EVERY_MINUTES: "5"
          IDN_REFRESH_TOKEN: ${{ secrets.IDN_REFRESH_TOKEN }}
        run: node src/poll.js
